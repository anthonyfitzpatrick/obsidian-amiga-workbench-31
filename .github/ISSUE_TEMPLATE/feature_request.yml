name: Feature request
description: Propose a focused improvement to Amiga Workbench 3.1.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This theme aims at a faithful Workbench feel rather than broad configurability. Proposals that keep that character are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What part of the interface is unclear, unreadable, or unstyled?
      placeholder: I find it difficult to...
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested Solution
      description: Describe the appearance or behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: authenticity
    attributes:
      label: Workbench Precedent
      description: If this reflects how the real Workbench behaved, say so, and cite what you are going from.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add screenshots, mockups, or links that clarify the proposal.
