name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install; the build is plain Node.
      - name: Rebuild theme.css
        run: npm run build
      - name: Fail if the committed theme.css was stale
        run: git diff --exit-code -- theme.css
      - name: Verify
        run: npm test

      - name: Audit
        run: python3 tools/audit.py
